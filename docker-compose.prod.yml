services:
  mysql:
    image: mysql:8.0
    container_name: kcube-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: u786588890_kcube
      MYSQL_USER: u786588890_jatin_kcube
      MYSQL_PASSWORD: KcubeStrongPass123!
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build: ./backend
    container_name: kcube-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      API_PREFIX: /api/v1
      APP_URL: https://k-cube.store
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MYSQL_HOST: in-mum-web2207.main-hosting.eu
      MYSQL_PORT: 3306
      MYSQL_DATABASE: u786588890_kcube
      MYSQL_USER: u786588890_jatin_kcube
      MYSQL_PASSWORD: KcubeStrongPass123!
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-1DRBSwINqd7JhqhVc7VI9xH_ha-rXRdRbmXd068EdtsU}
      GOOGLE_SHEETS_TAB_NAME: ${GOOGLE_SHEETS_TAB_NAME:-Applications}
      GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SHEETS_PRIVATE_KEY: ${GOOGLE_SHEETS_PRIVATE_KEY:-}
      GOOGLE_SHEETS_SYNC_ENABLED: ${GOOGLE_SHEETS_SYNC_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-K-CUBE <no-reply@kcube.local>}
      INDIA_PRE_SELECTION_EMAIL_CC: ${INDIA_PRE_SELECTION_EMAIL_CC:-kcubeadm@gmail.com,taehwanlim@gmail.com,lkmallshop@gmail.com}
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: kcube-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: kcube-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql-data:
