services:
  backend:
    build: ./backend
    container_name: kcube-backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: true
    environment:
      PORT: 4000
      NODE_ENV: production
      API_PREFIX: /api/v1
      APP_URL: https://k-cube.store
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: kcube-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      __NEXT_PRIVATE_ORIGIN: https://k-cube.store
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: kcube-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
