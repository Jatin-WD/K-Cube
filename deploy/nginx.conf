server {
    listen 80;
    server_name k-cube.store www.k-cube.store;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name k-cube.store www.k-cube.store;

    ssl_certificate /etc/letsencrypt/live/k-cube.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k-cube.store/privkey.pem;

    client_max_body_size 25m;

    location /api/v1/ {
        proxy_pass http://backend:4000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
